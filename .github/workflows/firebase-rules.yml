name: Deploy Firestore rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firebase-rules.yml
permissions:
  contents: read
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project cascade-9d329 --non-interactive
